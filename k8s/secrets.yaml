# WARNING: Do NOT commit real values to git.
# Use `kubectl create secret` or a secrets manager in production.
#
# Generate a strong JWT secret:
#   node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
#
apiVersion: v1
kind: Secret
metadata:
  name: netlike-secrets
  namespace: netlike
type: Opaque
stringData:
  MONGO_URI: "mongodb://mongo-0.mongo.netlike.svc.cluster.local:27017/netlike"
  JWT_SECRET: "replace_with_a_long_random_string"
  TMDB_API_KEY: "replace_with_your_tmdb_bearer_token"
