server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — send all unknown paths to index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api calls to the backend service.
    # In Docker Compose the backend is reachable by its service name "backend".
    # In Kubernetes the Ingress intercepts /api before it ever reaches this nginx,
    # so this block is effectively a no-op there.
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
